# XcodeGen spec. The cloud build runs `xcodegen generate` to create KBWorkout.xcodeproj.
name: KBWorkout
options:
  bundleIdPrefix: com.adesai
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KBWorkout:
    type: application
    platform: iOS
    sources:
      - path: KBWorkout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adesai.kbworkout
        PRODUCT_NAME: KBWorkout
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KB Workout
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
