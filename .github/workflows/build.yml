# On every push to main:
#   test  – unit tests + UI tests in the iPhone simulator, with screenshots of every screen.
#           Results are force-pushed to the `qa-results` branch (summary.md, screenshots/, logs).
#   build – only if tests pass: unsigned .ipa + SideStore source, published as a GitHub release.
name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the workout library is up to date
        run: |
          python3 tools/build_library.py > /dev/null
          git diff --exit-code KBWorkout/Resources/library.json || {
            echo "::error::library.json is out of date. Run python3 tools/build_library.py and commit the result."; exit 1; }

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, ds in devices.items() if ".iOS-" in runtime for d in ds if d["name"].startswith("iPhone")]
          def rank(item):
              runtime, d = item
              version = [int(x) for x in runtime.split(".iOS-")[1].split("-")]
              preferred = d["name"] in ("iPhone 16", "iPhone 17", "iPhone 16 Pro", "iPhone 17 Pro", "iPhone 15")
              return (version, preferred)
          runtime, d = max(phones, key=rank)
          print(d["udid"], file=sys.stdout)
          print("Using", d["name"], runtime, file=sys.stderr)
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Run tests
        run: |
          mkdir -p qa/screenshots
          set +e
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/qa/screenshots" xcodebuild test \
            -project KBWorkout.xcodeproj -scheme KBWorkout -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO > qa/xcodebuild.log 2>&1
          echo $? > qa/exit-code
          python3 tools/qa_summary.py qa/xcodebuild.log qa/summary.md "$(cat qa/exit-code)"
          gzip -9 qa/xcodebuild.log

      - name: Publish QA results to the qa-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd qa
          echo "${{ github.sha }}" > commit.txt
          git init -q -b qa-results
          git add -A
          git -c user.name="QA bot" -c user.email="qa@users.noreply.github.com" commit -qm "QA for ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" qa-results

      - name: Fail if tests failed
        run: test "$(cat qa/exit-code)" = "0"

  build:
    needs: test
    runs-on: macos-15
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KBWorkout.xcodeproj -scheme KBWorkout -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="1.0.$BUILD" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/KBWorkout.app

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/KBWorkout.app Payload/
          zip -qry KBWorkout.ipa Payload

      - name: Write SideStore source
        run: |
          python3 tools/write_source.py \
            --repo "${{ github.repository }}" --build "$BUILD" --ipa KBWorkout.ipa \
            --notes "$(git log -1 --pretty=%s)" > source.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$BUILD" KBWorkout.ipa source.json \
            --title "Build $BUILD" --notes "$(git log -1 --pretty=%B)" --latest
